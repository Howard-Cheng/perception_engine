# Perception Engine Configuration File
# Lines starting with # are comments
# Format: key=value

[embedding]
model_path=models/embedding/model_q4.onnx
tokenizer_path=models/embedding/tokenizer
python_executable=py
chunk_document_script=scripts/chunk_document.py

[session_manager]
enabled=true
compression_threshold=20
similarity_threshold=65.0
batch_size=100

[database]
type=elasticsearch
host=localhost
port=9200
index=perception_events

[elasticsearch]
host=localhost
port=9200
index=perception_context

[linguacore]
# Check interval in seconds (how often to query for new unsummarized content)
check_interval_seconds=60
# Maximum number of events to process per batch
batch_size=10
# Enable verbose logging
verbose=true

[llm]
# Path to LLM model file (e.g., Phi-3, Llama, etc.)
model_path=models/phi4-aitc/phi-3-mini-4k-instruct-q4.gguf
# Maximum tokens for summary generation
max_tokens=200
# Temperature for generation (0.0-2.0)
temperature=0.7

[qdrant]
# Qdrant vector database settings
host=localhost
port=6333
collection=perception_summaries
vector_size=384

[postgresql]
host=localhost
port=5432
dbname=perception_engine
user=postgres
password=
table=perception_context
maxundeletelength=100
outofdatehour=24

[models]
whisper_path=models/whisper/ggml-small.bin
vad_path=models/vad/silero_vad.onnx

[paths]
temp_directory=temp
log_directory=logs

[blacklist]
# Application names to ignore (case-insensitive)
# Format: comma-separated list or one per line with app_N=value
# Examples of system/utility apps that should be ignored:
app_1=winxin
app_2=dwm
app_3=winlogon
app_4=csrss
app_5=taskmgr
app_6=cmd
app_7=conhost
app_8=ApplicationFrameHost
app_9=ShellExperienceHost
app_10=dbeaver
app_11=devenv
app_12=SearchHost
app_13=Explorer
app_14=csc_ui
app_15=VsDebugConsole
app_16=Desktop
app_17=Unknown
# You can add more apps as needed
# app_11=your_app_name

[onlinelocation]
baseUrl=https://nominatim.openstreetmap.org/reverse
format=json
addressdetails=1
extratags=1
zoom=18
email=lixb18@lenovo.com
accept-language=en

[voicecontext]
# Voice Recognition Configuration
# Recognition mode: true for embedded/offline mode, false for online (Azure) mode
use_embedded_model=true
# Auto start recognition after initialization
auto_start=true

# Online mode configuration (Azure Speech Service)
subscription_key=
service_region=eastasia
language=zh-CN

# Embedded mode configuration (Lenovo Qira preloaded model)
# Base path where models are located
embedded_model_path=C:\Program Files\Lenovo\Lenovo Qira\Preloaded
# Full model name (leave empty for auto-detection)
embedded_model_name= ms_stt_speechmodel
# Model license text
embedded_model_license=This model and the software may not be used or distributed in any manner except as authorized under a valid written agreement, using the reference number 5192510683. The model and software are licensed and not sold, and the agreement provides limited rights to use the model and the software and Microsoft reserves all other rights. You may not work around any technical limitations in the model or the software, reverse engineer, decompile, or disassemble the model or the software; remove, minimize, block or modify any notices of Microsoft or its suppliers in the model or the software; or, share, publish, rent, or lease the model or software, or provide the model or software as a standalone solution for others to use.

# Recognition parameters
silence_timeout_ms=1500
end_silence_timeout_ms=3000

# Keyword recognition
enable_keyword=false
keyword_model_path=