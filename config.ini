# Perception Engine Configuration File
# Lines starting with # are comments
# Format: key=value

[embedding]
model_path=models/embedding/model_q4.onnx
tokenizer_path=models/embedding/tokenizer
python_executable=py
chunk_document_script=scripts/chunk_document.py

[session_manager]
enabled=true
compression_threshold=20
similarity_threshold=65.0
batch_size=100

[database]
type=elasticsearch
host=localhost
port=9200
index=perception_events

[models]
whisper_path=models/whisper/ggml-small.bin
vad_path=models/vad/silero_vad.onnx

[paths]
temp_directory=temp
log_directory=logs

[blacklist]
# Application names to ignore (case-insensitive)
# Format: comma-separated list or one per line with app_N=value
# Examples of system/utility apps that should be ignored:
app_1=winxin
app_2=dwm
app_3=winlogon
app_4=csrss
app_5=taskmgr
app_6=cmd
app_7=conhost
app_8=ApplicationFrameHost
app_9=ShellExperienceHost
app_10=SearchHost
# You can add more apps as needed
# app_11=your_app_name
