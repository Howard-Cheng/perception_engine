version: '3.8'

services:
  # Elasticsearch 主服务
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      # 节点配置
      - node.name=es-node-1
      - cluster.name=perception-engine-cluster
      - discovery.type=single-node
      
      # 内存配置
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      
      # 安全配置（开发环境）
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      
      # 性能优化
      - indices.memory.index_buffer_size=30%
      - thread_pool.write.queue_size=1000
      
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    
    volumes:
      # 持久化数据存储
      - elasticsearch_data:/usr/share/elasticsearch/data
      # 日志存储
      - elasticsearch_logs:/usr/share/elasticsearch/logs
    
    ports:
      # REST API
      - "9200:9200"
      # 节点通信
      - "9300:9300"
    
    networks:
      - elastic
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped
    
    labels:
      - "com.perception.service=elasticsearch"
      - "com.perception.environment=development"

  # Kibana 可视化界面（可选）
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    hostname: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - xpack.security.enabled=false
      - LOGGING_VERBOSE=false
    
    ports:
      - "5601:5601"
    
    networks:
      - elastic
    
    depends_on:
      elasticsearch:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped
    
    labels:
      - "com.perception.service=kibana"
      - "com.perception.environment=development"

volumes:
  # Elasticsearch 数据卷
  elasticsearch_data:
    driver: local
    labels:
      - "com.perception.volume=elasticsearch-data"
  
  # Elasticsearch 日志卷
  elasticsearch_logs:
    driver: local
    labels:
      - "com.perception.volume=elasticsearch-logs"

networks:
  elastic:
    driver: bridge
    labels:
      - "com.perception.network=elastic"
